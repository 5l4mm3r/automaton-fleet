# Automaton Fleet — living-founder restart protection (host maintenance).
#
# Installed as /etc/needrestart/conf.d/50-automaton-fleet-founders.conf (root:root 0644) by
# scripts/fleet-maintenance-guard.sh install (also scripts/fleet-os-setup.sh --apply).
#
# Security updates keep installing automatically (unattended-upgrades is unchanged) and needrestart keeps
# DETECTING founder units that run outdated code. It must never RESTART one: in automatic mode (the apt /
# unattended-upgrades hook) a service matched here with 0 is deferred, not restarted; interactively the default
# answer is "no". A living founder restart is an explicit Fleet lifecycle/maintenance operation with preflight,
# runtime-pin verification, state protection and post-restart attestation (scripts/fleet-founders.sh).
#
# Incident: 2026-09-28 06:59:58 UTC unattended-upgrade (python3-requests) -> DPkg::Post-Invoke needrestart ->
# restarted automaton-fleet-founder@01M3F50SH7PNX2E3GST13J52AS.service.
$nrconf{override_rc}->{qr(^automaton-fleet-founder@.+\.service$)} = 0;
