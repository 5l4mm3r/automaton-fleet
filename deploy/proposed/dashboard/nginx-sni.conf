# PROPOSED (not applied): serve admin.agentfleet.vip and api.agentfleet.vip on the same public :443.
# nginx stream SNI routing: api.agentfleet.vip passes through (TLS untouched) to FleetController, which moves from
# 0.0.0.0:443 to 127.0.0.1:8443 (FLEET_PUBLIC_LISTEN); admin.agentfleet.vip is terminated by nginx (its own Let's Encrypt
# certificate) and proxied to the dashboard on 127.0.0.1:8790. Requires: nginx with the stream module (OS package),
# a DNS A record admin.agentfleet.vip → the VPS, a certificate, and moving the controller listener (production change).

stream {
  map $ssl_preread_server_name $fleet_upstream {
    api.agentfleet.vip    127.0.0.1:8443;   # FleetController (TLS passthrough)
    admin.agentfleet.vip  127.0.0.1:9443;   # nginx https server below
    default               127.0.0.1:9443;
  }
  server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $fleet_upstream;
    proxy_connect_timeout 5s;
  }
}

http {
  server_tokens off;
  limit_req_zone $binary_remote_addr zone=fleet_admin:10m rate=10r/s;
  server {
    listen 127.0.0.1:9443 ssl;
    http2 on;
    server_name admin.agentfleet.vip;
    ssl_certificate     /etc/letsencrypt/live/admin.agentfleet.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.agentfleet.vip/privkey.pem;
    ssl_protocols TLSv1.3;
    client_max_body_size 22m;
    location / {
      limit_req zone=fleet_admin burst=40 nodelay;
      proxy_pass http://127.0.0.1:8790;
      proxy_set_header Host admin.agentfleet.vip;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
