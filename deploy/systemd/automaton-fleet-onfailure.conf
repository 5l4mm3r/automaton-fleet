# Drop-in for each critical Fleet unit (installed as /etc/systemd/system/<unit>.d/50-onfailure.conf). When the unit gives
# up restarting (Restart=on-failure exhausted its StartLimitBurst), the heartbeat runs at once and reports the failed unit
# to the outside monitor, which alerts the owner's phone. NOT INSTALLED by default.
[Unit]
OnFailure=automaton-fleet-heartbeat.service
