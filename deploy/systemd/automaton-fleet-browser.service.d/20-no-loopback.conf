# v79 — browser network isolation (installed by scripts/fleet-browser-isolation.sh apply; never by hand).
# The worker reaches PostgreSQL over its unix socket, so it needs no IP address on this host at all: the reset below
# removes the base unit's IPAddressAllow=localhost and loopback joins the denied ranges. Pages (and Chromium) can no
# longer reach the controller, operator API, dashboard, TLS edge, PostgreSQL or Redis over 127.0.0.1 / ::1 — whatever
# a name resolves to (closes the DNS-rebinding window left by the worker's name check). The public internet is unchanged.
# v126-egress — the one exception: 127.0.0.77, where the worker's own egress proxy listens (src/fleet/browser/egress.ts,
# BROWSER_EGRESS_ADDRESS). Chromium reaches the network only through it. No host service listens on that address itself;
# a service bound to every address (0.0.0.0 / [::]) answers there as it already does on the host's public address, and
# `fleet-browser-isolation.sh verify` fails if any port opens on 127.0.0.77 that does not also open on the public address.
[Service]
IPAddressAllow=
IPAddressAllow=127.0.0.77/32
IPAddressDeny=127.0.0.0/8 ::1/128
