# /etc/nginx/automaton-fleet-edge.conf — Automaton Fleet TLS edge (R36). A complete nginx main configuration, run by
# automaton-fleet-edge.service (never by the stock nginx.service, which stays disabled: nothing listens on :80, so
# certbot --standalone keeps working).
#
#   :443 (IPv4, as the controller today) ── stream, SNI preread, PROXY protocol v1 ──┐
#     admin.agentfleet.vip  → 127.0.0.1:9443  nginx terminates TLS (Let's Encrypt), → dashboard 127.0.0.1:8790
#     anything else         → 127.0.0.1:8443  FleetController (TLS passthrough: the API certificate never leaves it)
#
# The PROXY line carries the real client address. FleetController reads it only on its loopback-bound
# FLEET_PUBLIC_LISTEN with FLEET_PUBLIC_PROXY_PROTOCOL=true, and never treats a proxied request as local (founder
# credentials and detailed /readyz stay on its direct 127.0.0.1:8787 listener). The admin server overwrites
# X-Forwarded-For with that address (never appends a client-supplied header). No API traffic is decrypted here.
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

user www-data;
worker_processes 1;
pid /run/automaton-fleet-edge.pid;
error_log /var/log/nginx/automaton-fleet-edge.error.log warn;

events {
  worker_connections 1024;
}

stream {
  map $ssl_preread_server_name $fleet_edge_upstream {
    admin.agentfleet.vip  127.0.0.1:9443;
    default               127.0.0.1:8443;
  }
  server {
    listen 443;
    ssl_preread on;
    preread_timeout 10s;
    proxy_pass $fleet_edge_upstream;
    proxy_protocol on;
    proxy_connect_timeout 5s;
  }
}

http {
  server_tokens off;
  access_log off;
  client_body_temp_path /var/lib/nginx/body;
  proxy_temp_path /var/lib/nginx/proxy;
  limit_req_zone $proxy_protocol_addr zone=fleet_admin:10m rate=10r/s;
  # 2026-10-16 (mobile fix): the build's static files (immutable, cached by the browser after the first load) have their
  # own allowance, so a first visit's ~20 files do not use up the sign-in and data budget above (unchanged: 10 r/s, burst
  # 40 per real client address). A refusal answers 429 with Retry-After: the dashboard waits and retries its reads.
  limit_req_zone $proxy_protocol_addr zone=fleet_admin_static:10m rate=30r/s;
  limit_req_status 429;
  # Refusals are logged with the REAL client address (the error log shows only the loopback PROXY hop), the path
  # without its query string, and nothing else.
  map $status $fleet_limited { 429 1; default 0; }
  log_format fleet_limited '$time_iso8601 $proxy_protocol_addr $status "$request_method $uri"';

  server {
    listen 127.0.0.1:9443 ssl http2 proxy_protocol;
    server_name admin.agentfleet.vip;
    # Only the stream server above (TCP peer 127.0.0.1) may connect.
    allow 127.0.0.1;
    deny all;

    ssl_certificate     /etc/letsencrypt/live/admin.agentfleet.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.agentfleet.vip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 22m;

    if ($host != "admin.agentfleet.vip") {
      return 421;
    }
    access_log /var/log/nginx/automaton-fleet-edge.limited.log fleet_limited if=$fleet_limited;
    error_page 429 = @fleet_busy;
    location @fleet_busy {
      add_header Retry-After 1 always;
      add_header Cache-Control no-store always;
      return 429;
    }
    location /_next/static/ {
      limit_req zone=fleet_admin_static burst=120 nodelay;
      proxy_pass http://127.0.0.1:8790;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host admin.agentfleet.vip;
      proxy_set_header X-Forwarded-For $proxy_protocol_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / {
      limit_req zone=fleet_admin burst=40 nodelay;
      proxy_pass http://127.0.0.1:8790;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host admin.agentfleet.vip;
      proxy_set_header X-Forwarded-For $proxy_protocol_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
